<section id="swimming-pool-chemistry">
<figure class="photo" id="fig-pool" data-figure="3.1">
  <img src="/media/ch03/CNX_Chem_03_00_Pool.jpg" alt="该图显示一个注满水的游泳池，四周环绕着混凝土平台。">
  <figcaption><span class="eyebrow">Figure 3.1</span><span>游泳池中的水是一种复杂的混合物，其中各种物质的相对含量必须小心维持，以确保使用泳池的人的健康与舒适。（来源：改编自 Vic Brincat 的作品）</span></figcaption>
</figure>
<p>游泳池长期以来一直是人们休闲、锻炼和进行物理治疗的常用场所。由于经常用淡水重新注满大型泳池并不现实，泳池水需要定期用化学品处理，以防止有害细菌和藻类的生长。泳池的妥善维护需要定期按精确计量的用量加入各种<span data-concept="compound">化合物</span>。例如，水中钙<span data-concept="ion">离子</span> Ca<sup>2+</sup> 的相对含量应保持在一定范围内，以防止刺激眼睛，并避免损坏池底和管道。为了维持适当的钙含量，钙<span data-concept="cation">阳离子</span>以一种同时含有<span data-concept="anion">阴离子</span>的<span data-concept="ionic-compounds">离子化合物</span>的形式加入水中；因此，要达到适当的钙含量，既需要知道该<span data-concept="compound">化合物</span>中 Ca<sup>2+</sup> 的相对含量，也需要知道泳池中水的<span data-concept="volume">体积</span>。物质（如含钙<span data-concept="compound">化合物</span>）和<span data-concept="mixture">混合物</span>（如泳池水）的组成在数量方面的内容，正是本章的主题。</p>
