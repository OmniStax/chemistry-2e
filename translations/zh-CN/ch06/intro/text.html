  <figcaption><span class="eyebrow">Figure 6.1</span><span>蟹状星云由一颗超新星（恒星的爆炸）的残骸构成。这幅合成图像由美国国家航空航天局（NASA）的哈勃空间望远镜制作。通过测量所发射光的<span data-concept="wavelength">波长</span>，天文学家得以确定星云中的元素，并断定其中含有特定的离子，包括 S<sup>+</sup>（绿色丝状体）和 O<sup>2+</sup>（红色丝状体）。（来源：改编自 NASA 和欧洲空间局（ESA）的作品）</span></figcaption>
</figure>
<p>1054 年，中国天文学家记录到天空中出现了一颗“客星”，白天也能看见，此后两年间它慢慢消失。这次突然出现是由超新星爆发造成的，超新星比原来的恒星亮得多。尽管这颗超新星是在近一千年前观测到的，但留下的蟹状星云（图 6.1）至今仍在释放<span data-concept="energy-and-work">能量</span>。它不仅发出可见光，还发出红外线、X 射线和其他形式的<span data-concept="electromagnetic-radiation">电磁辐射</span>。星云既发出连续光谱（蓝白色的辉光），也发出原子发射光谱（彩色的丝状体）。在本章中，我们将讨论光和其他形式的<span data-concept="electromagnetic-radiation">电磁辐射</span>，以及它们与<span data-concept="atom">原子</span>电子结构的关系。我们还将看到，如何利用这种辐射来鉴别<span data-concept="element">元素</span>，即使这些元素远在数千光年之外。</p>
