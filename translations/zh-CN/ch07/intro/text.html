<section id="buckminsterfullerene">
<figure class="photo" id="fig-bucky" data-figure="7.1">
  <img src="/media/ch07/CNX_Chem_07_00_Bucky.jpg" alt="共显示三幅图。左图是一个多面球形球体，由六边形环构成，每个顶角处有一个碳原子。中图是一个足球。右图是一座水塔形的建筑，其侧面由六边形环构成。">
  <figcaption><span class="eyebrow">Figure 7.1</span><span>巴克敏斯特富勒烯分子（C<sub>60</sub>）绰号“巴基球”，只含碳原子（左），这些碳原子排列成由六边形和五边形构成的几何骨架，类似于足球表面的图案（中）。这种分子结构以建筑师 R. 巴克敏斯特·富勒（R. Buckminster Fuller）的名字命名，他的创新设计将简单的几何形状组合起来，创造出大型而坚固的结构，例如亚利桑那州图森附近的这座气象雷达罩（右）。（来源 中：改编自 “Petey21”/Wikimedia Commons 的作品；右：改编自 Bill Morrow 的作品）</span></figcaption>
</figure>
<p>人们早就知道，纯碳以不同的形态（<span data-concept="allotropes">同素异形体</span>）存在，包括石墨和金刚石。但直到 1985 年，才发现了碳的一种新形态：巴克敏斯特富勒烯。这种<span data-concept="molecule">分子</span>以建筑师兼发明家 R. 巴克敏斯特·富勒（R. Buckminster Fuller，1895–1983）的名字命名，他的标志性建筑设计是短程线穹顶，其特点是以格状壳体结构支撑球面。实验证据揭示了其化学式 C<sub>60</sub>，随后科学家们确定了 60 个碳<span data-concept="atom">原子</span>如何形成一个对称而稳定的<span data-concept="molecule">分子</span>。指导他们的是成键<span data-concept="scientific-theory">理论</span>——这正是本章的主题——它解释了单个<span data-concept="atom">原子</span>如何连接起来形成更复杂的结构。</p>
