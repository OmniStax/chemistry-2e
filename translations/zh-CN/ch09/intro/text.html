<p>我们被<span data-concept="gas">气体</span>的海洋——<span data-concept="earth-atmosphere">大气</span>——所包围，日常活动使我们熟悉<span data-concept="gas">气体</span>的许多性质。受热的<span data-concept="gas">气体</span>会膨胀，这可以使热气球上升（图 9.1），也可以使炎热天气里留在阳光下的自行车轮胎爆胎。</p>
<p><span data-concept="gas">气体</span>在<span data-concept="chemistry">化学</span>的发展中起过重要作用。在十七和十八世纪，许多科学家研究了<span data-concept="gas">气体</span>的行为，首次给出了<span data-concept="matter">物质</span>行为的数学描述。</p>
<p>在本章中，我们将考察<span data-concept="gas">气体</span><span data-concept="temperature">温度</span>、<span data-concept="gas-pressure">压强</span>、物质的量与<span data-concept="volume">体积</span>之间的关系。我们将研究一个简单的理论模型，并用它分析<span data-concept="gas">气体</span>的实验行为。这些分析的结果将向我们表明该<span data-concept="scientific-theory">理论</span>的局限，以及如何改进它。</p>
