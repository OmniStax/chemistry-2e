<p>想象一处挤满日光浴者和游泳者的海滩。晒太阳的人觉得太热时，就下海游泳降温；游泳的人累了，又回到海滩休息。如果日光浴者下海的速率等于游泳者回到沙滩的速率，那么日光浴者和游泳者的人数（尽管不是同一批人）就会保持不变。这一情景说明了一种称为<em><span data-concept="chemical-equilibrium">平衡</span></em>的动态现象，即相反的过程以相等的速率进行。化学过程和物理过程中都存在这种现象；当正反应和逆<span data-concept="reaction-rate">反应速率</span>相等时，这些过程就处于<span data-concept="chemical-equilibrium">平衡</span>。<span data-concept="chemical-equilibrium">平衡</span><span data-concept="system">体系</span>在自然界中无处不在；涉及血液中<span data-concept="dissolved">溶解的</span>二氧化碳的各种反应就是例子（见图 13.1）。本章对化学平衡的基本内容作了全面的介绍。</p>
