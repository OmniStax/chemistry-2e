  <img src="/media/ch14/CNX_Chem_14_00_Sinkhole.jpg" alt="落水洞中形成的一片池塘，浑浊的绿色池水周围是层层石灰岩，岸边有树木和灌木。">
  <figcaption><span class="eyebrow">Figure 14.1</span><span>这样的落水洞是酸性地下水与碱性岩层（如石灰岩）发生反应的结果。（来源：改编自 Emil Kehnel 的作品）</span></figcaption>
</figure>
<p><span data-concept="liquid">液态</span>水对我们这个星球上的生命至关重要，涉及水的特征<span data-concept="ion">离子</span> H<sup>+</sup> 和 OH<sup>–</sup> 的<span data-concept="chemistry">化学</span>在自然界和社会中随处可见。正如本书另一章所介绍的，酸碱<span data-concept="chemistry">化学</span>涉及氢<span data-concept="ion">离子</span>从给体（<span data-concept="acid">酸</span>）到受体（<span data-concept="base">碱</span>）的转移。这些 H+ 转移反应是可逆的，酸碱<span data-concept="system">体系</span>所建立的平衡是从落水洞的形成（图 14.1）到人体内氧气运输等各种现象的重要方面。本章将进一步探讨酸碱<span data-concept="chemistry">化学</span>，重点放在这一类重要反应的<span data-concept="chemical-equilibrium">平衡</span>方面。</p>
