<section id="equilibria-of-other-reaction-classes">
<figure class="photo" id="fig-fluorite" data-figure="15.1">
  <img src="/media/ch15/CNX_Chem_15_00_Fluorite.jpg" alt="一簇立方体和八面体的萤石晶体，大多透明，最大的一块中心呈祖母绿色，角部呈紫色，另有一小片宝蓝色。">
  <figcaption><span class="eyebrow">Figure 15.1</span><span>萤石矿物（CaF<sub>2</sub>）是地壳中地下水里溶解的钙离子和氟离子沉淀而成的。请注意，纯净的萤石是无色的，该样品中的颜色是由晶体中存在的其他金属离子所致。</span></figcaption>
</figure>
<p>萤石矿物 CaF<sub>2</sub>（图 15.1）外观引人注目，常被用作半宝石，制成多种珠宝首饰。萤石矿床是经由一种称为热液沉淀的过程形成的：<span data-concept="dissolved">溶解</span>在地下水中的钙和氟<span data-concept="ion">离子</span>在<span data-concept="mixtures">溶液</span>条件发生某种变化时结合，生成<span data-concept="insoluble">不溶的</span> CaF<sub>2</sub>。例如，若在较低<span data-concept="temperature">温度</span>下超过了萤石的<span data-concept="solubility">溶解度</span>，则<span data-concept="temperature">温度</span>降低可能引发萤石沉淀。由于氟<span data-concept="ion">离子</span>是一种<span data-concept="weak-base">弱碱</span>，其<span data-concept="solubility">溶解度</span>也受<span data-concept="mixtures">溶液</span>的 <span data-concept="ph">pH</span> 影响，因此改变地下水 <span data-concept="ph">pH</span> 的地质过程或其他过程也会影响萤石的沉淀。本章扩展了其他各章对<span data-concept="chemical-equilibrium">平衡</span>的讨论，涉及另外一些反应类型（包括沉淀）以及含有多重<span data-concept="chemical-equilibrium">平衡</span>反应的体系。</p>
</section>
