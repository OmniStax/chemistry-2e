  <figcaption><span class="eyebrow">Figure 16.1</span><span>间歇泉是自然界中热力学原理的生动展示。间歇泉地下通道深处的水处于高压之下，并被岩浆加热到高温。当靠近地表的一团水达到沸点并被排出时，由此造成的压强下降使更大体积的水骤然沸腾，将水蒸气和水猛烈喷出，形成壮观的喷发。（来源：改编自 Yellowstone National Park 的作品）</span></figcaption>
</figure>
<p><span data-concept="chemistry">化学</span>的诸多能力之一，是能够预测一个过程在指定条件下是否会发生。热力学是研究与化学过程和物理过程相关的<span data-concept="energy-and-work">能量</span>与<span data-concept="work">功</span>之间关系的学科，它提供了这种预测能力。本书前面的章节已经介绍了<span data-concept="thermochemistry">热化学</span>的各种应用，热化学是热力学的一个重要方面，涉及化学反应和相变所伴随的<span data-concept="heat-flow">热量流动</span>。本章将介绍更多的热力学概念，包括那些能够预测在给定条件下发生的任何化学变化或<span data-concept="physical-change">物理变化</span>的概念。</p>
