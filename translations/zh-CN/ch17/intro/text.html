<p>本书另一章介绍了<span data-concept="redox-reaction">氧化还原反应</span>的<span data-concept="chemistry">化学</span>。这一重要的反应类型以一种或多种<span data-concept="reactant">反应物</span><span data-concept="element">元素</span>的<span data-concept="oxidation-number">氧化态</span>变化来定义，其中包括一类在<span data-concept="reactant">反应物</span>物种之间转移<span data-concept="electron">电子</span>的反应。十八、十九世纪之交前后，化学家开始探索让这些<span data-concept="electron">电子</span>通过外电路<em>间接</em>转移，而不是通过氧化还原<span data-concept="reactant">反应物</span>的紧密接触直接转移的方法。此后的两个世纪里，<em>电化学</em>这一领域不断发展，既为氧化还原<span data-concept="chemistry">化学</span>的基本问题带来了重要的认识，也催生了大量技术，从工业规模的冶金过程，到用于电动汽车的坚固耐用的可充电<span data-concept="battery">电池</span>（图 17.1）。本章将讨论电化学的基本概念。</p>
