<p>19世纪中叶<span data-concept="periodic-table">元素周期表</span>的建立，源于人们观察到<span data-concept="element">元素</span>的性质之间存在周期性关系。化学家了解这些性质的变化规律，便能运用这一知识解决各种各样的技术难题。例如，硅和其他半导体构成了现代电子学的支柱，这是因为我们能够对这些材料的电学性质进行精细调控。本章探讨<span data-concept="periodic-table">元素周期表</span>中<span data-concept="representative-metal">主族金属</span>、<span data-concept="metalloid">半金属</span>和<span data-concept="nonmetal">非金属</span>的重要性质。</p>
