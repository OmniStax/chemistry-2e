<p>我们在前面各章中考虑的化学反应，涉及参与反应的物种<em>电子</em>结构的变化，也就是<span data-concept="electron">电子</span>围绕<span data-concept="atom">原子</span>、<span data-concept="ion">离子</span>或<span data-concept="molecule">分子</span>的排布。而<em>核</em>结构，即所涉<span data-concept="atom">原子</span>的原子核内<span data-concept="proton">质子</span>和<span data-concept="neutron">中子</span>的数目，在化学反应中保持不变。</p>
<p>本章将介绍<span data-concept="nuclear-chemistry">核化学</span>这一主题。核化学始于 1896 年法国物理学家安托万·贝克勒尔（Antoine Becquerel）对<span data-concept="radioactivity">放射性</span>的发现，并在20 世纪和 21 世纪变得日益重要，为能源、医学、地质学及许多其他领域的各种技术提供了基础。</p>
